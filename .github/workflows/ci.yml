name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Build and test MCP server
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test

  revit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # One .NET Framework and both .NET 8 targets; the release workflow builds every year.
        config: ["Release R24", "Release R25", "Release R26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin and command set
        run: dotnet build mcp-servers-for-revit.sln -c "${{ matrix.config }}"
